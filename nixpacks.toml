[variables]
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.setup]
nixPkgs = [
  "chromium",
  "nss",
  "nspr",
  "atk",
  "cups",
  "dbus",
  "libdrm",
  "libxkbcommon",
  "mesa",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
  "expat",
  "alsa-lib",
  "pango",
  "cairo",
  "libuuid"
]

[phases.install]
cmds = [
  "pip install greenlet==3.1.1",
  "pip install flask==3.0.3 requests==2.32.3 gunicorn==22.0.0",
  "pip install playwright==1.49.0 --no-deps",
  "pip install pyee",
  "playwright install chromium",
  "playwright install-deps chromium"
]

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
